<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>건우's 맛지도</title>
    <!-- 네이버 지도 API -->
    <script type="text/javascript" src="https://openapi.map.naver.com/openapi/v3/maps.js?ncpClientId=b5d5dmjvd1&modules=geocoder"></script>
    <style>
        :root {
            --primary-color: #e63946;
            --bg-color: #fff5f5;
            --box-bg: #ffffff;
            --text-color: #333333;
            --border-color: #ffcccc;
        }

        body {
            font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
            /* PC 배경 사진 복구 */
            background: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), url('https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?auto=format&fit=crop&w=1920&q=80') no-repeat center center fixed;
            background-size: cover;
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--box-bg);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border-color);
            box-sizing: border-box;
        }

        .header {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin-bottom: 25px;
            border-bottom: 2px dashed var(--border-color);
            padding-bottom: 15px;
        }

        .profile-img {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--primary-color);
            margin-bottom: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .header h1 {
            margin: 5px 0;
            color: var(--primary-color);
            font-size: 1.6rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        .header p {
            margin: 0;
            color: #666;
            font-size: 0.9rem;
        }

        .form-section {
            background: #fff9f9;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #ffe6e6;
            margin-bottom: 25px;
        }

        .form-section h3 {
            margin-top: 0;
            color: var(--primary-color);
            font-size: 1.1rem;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            font-size: 0.9rem;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 0.95rem;
        }

        .btn-submit {
            background-color: var(--primary-color);
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-submit:hover {
            background-color: #d62839;
        }

        /* 맛집 리스트 영역 복구 */
        .restaurant-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 20px;
        }

        .restaurant-card {
            display: flex;
            background: #fff;
            border: 1px solid #eee;
            border-radius: 10px;
            padding: 12px;
            gap: 12px;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.03);
        }

        .restaurant-thumb {
            width: 60px;
            height: 60px;
            background: #ffe6e6;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            font-weight: bold;
            color: var(--primary-color);
            flex-shrink: 0;
            text-align: center;
        }

        .restaurant-info {
            flex-grow: 1;
            overflow: hidden;
        }

        .restaurant-info h4 {
            margin: 0 0 5px 0;
            font-size: 1.05rem;
        }

        .restaurant-info p {
            margin: 3px 0;
            font-size: 0.85rem;
            color: #555;
        }

        #map {
            width: 100%;
            height: 250px;
            border-radius: 10px;
            margin-top: 20px;
            border: 1px solid #ddd;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 헤더 영역 -->
        <div class="header">
            <img src="gunwoo.png" alt="건우 프로필" class="profile-img">
            <h1>🍳 건우 `s 맛지도</h1>
            <p>주인장만 조심스럽게 꺼내보는 비밀 맛집 리스트 🤫</p>
        </div>

        <!-- 맛집 등록 폼 -->
        <div class="form-section">
            <h3>[ 맛집 등록하기 ]</h3>
            <div class="form-group">
                <label>가게 이름</label>
                <input type="text" id="name" placeholder="상호명을 입력하세요 (예: 성수라 을지로점)">
            </div>
            <div class="form-group">
                <label>음식 종류</label>
                <select id="category">
                    <option value="한식">한식</option>
                    <option value="중식">중식</option>
                    <option value="일식">일식</option>
                    <option value="양식">양식</option>
                    <option value="고기/구이">고기/구이</option>
                    <option value="술집/기타">술집/기타</option>
                </select>
            </div>
            <div class="form-group">
                <label>별점 (1~5)</label>
                <input type="number" id="rating" min="1" max="5" step="0.5" value="5.0">
            </div>
            <div class="form-group">
                <label>한줄평</label>
                <input type="text" id="review" placeholder="특징이나 추천 메뉴를 남겨주세요">
            </div>
            <div class="form-group">
                <label>재방문 의사</label>
                <select id="revisit">
                    <option value="또 갈래요! 😆">또 갈래요! 😆</option>
                    <option value="고민좀... 🤔">고민좀... 🤔</option>
                    <option value="안갈래요 ❌">안갈래요 ❌</option>
                </select>
            </div>
            <div class="form-group">
                <label>관리자 암호</label>
                <input type="password" id="password" value="1234" style="width: 100px;">
            </div>
            <button class="btn-submit" onclick="addRestaurant()">등록하기</button>
        </div>

        <!-- 지도 영역 -->
        <div id="map"></div>

        <!-- 맛집 리스트 영역 복구 -->
        <div class="restaurant-list" id="restaurantList">
            <div class="restaurant-card">
                <div class="restaurant-thumb">한식</div>
                <div class="restaurant-info">
                    <h4>성수라 을지로점 ⭐ 4 (또 갈래요! 😆)</h4>
                    <p>고기와 곱창김 추가 추천, 생막걸리는 덤</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        var mapOptions = {
            center: new naver.maps.LatLng(37.5666103, 126.9783882),
            zoom: 13
        };
        var map = new naver.maps.Map('map', mapOptions);

        function addRestaurant() {
            const name = document.getElementById('name').value;
            if(!name) {
                alert('가게 이름을 입력해주세요!');
                return;
            }
            alert('맛집 등록 기능 연동 중입니다!');
        }
    </script>
</body>
</html>
